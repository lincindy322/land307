<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多分數加法計算器（連前持分計算）</title>
    <style>
        :root {
            --ty-primary: #E6005A;   /* 桃紅 */
            --ty-secondary: #008080; /* 藍綠 */
            --ty-dark: #2A2A2A;      
            --ty-light: #F9F9FB;     
            --ty-white: #FFFFFF;
            --ty-gray: #E0E0E0;
            --ty-accent-bg: #FFF0F5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--ty-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: var(--ty-dark);
        }
        .container {
            background-color: var(--ty-white);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 650px;
            width: 100%;
            border-top: 4px solid var(--ty-primary);
        }
        h2 {
            text-align: center;
            color: var(--ty-primary);
            margin-bottom: 25px;
            font-size: 1.4rem;
        }
        .fractions-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }
        .fraction-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .fraction-input {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .fraction-input input {
            width: 55px;
            height: 38px;
            text-align: center;
            font-size: 16px;
            border: 2px solid var(--ty-gray);
            border-radius: 6px;
            outline: none;
            transition: border-color 0.3s;
        }
        .fraction-input input:focus {
            border-color: var(--ty-primary);
        }
        .fraction-line {
            width: 60px;
            height: 2px;
            background-color: var(--ty-dark);
        }
        .operator {
            font-size: 24px;
            font-weight: bold;
            color: var(--ty-dark);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        button:hover {
            opacity: 0.85;
        }
        .btn-calc {
            background-color: var(--ty-primary);
            color: white;
            font-weight: bold;
        }
        .btn-add {
            background-color: var(--ty-accent-bg);
            color: var(--ty-primary);
            font-weight: bold;
            border: 1px solid var(--ty-primary);
        }
        .btn-remove {
            background-color: #fdf2f2;
            color: #d9534f;
            font-weight: bold;
            border: 1px solid #d9534f;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: var(--ty-light);
            border: 1px solid var(--ty-gray);
            border-radius: 8px;
            display: none;
            text-align: center;
        }
        .math-flex {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 4px;
        }
        .math-line {
            width: 100%;
            height: 2px;
            background: #2A2A2A;
            margin: 2px 0;
        }
        .equation-display {
            font-size: 20px;
            color: var(--ty-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            line-height: 2;
        }
        .final-answer {
            font-size: 24px;
            color: var(--ty-primary);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>多分數加法計算器（連前持分計算）</h2>
    
    <div class="fractions-wrapper" id="fractionsContainer"></div>

    <div class="btn-group">
        <button class="btn-add" onclick="addFractionInput()">＋ 增加分數</button>
        <button class="btn-remove" onclick="removeFractionInput()">－ 減少分數</button>
    </div>
    
    <button class="btn-calc" onclick="calculate()">計算結果</button>

    <div class="result-box" id="resultBox">
        <div class="equation-display" id="equationOutput"></div>
    </div>
</div>

<script>
    let fractionCount = 0;

    window.onload = function() {
        addFractionInput();
        addFractionInput();
        addFractionInput();
    };

    function addFractionInput() {
        fractionCount++;
        const container = document.getElementById('fractionsContainer');

        const item = document.createElement('div');
        item.className = 'fraction-item';
        item.id = `fraction-${fractionCount}`;

        if (container.children.length > 0) {
            const op = document.createElement('div');
            op.className = 'operator';
            op.innerText = '+';
            item.appendChild(op);
        }

        const inputBlock = document.createElement('div');
        inputBlock.className = 'fraction-input';
        inputBlock.innerHTML = `
            <input type="number" class="num-input" placeholder="分子">
            <div class="fraction-line"></div>
            <input type="number" class="den-input" placeholder="分母">
        `;

        item.appendChild(inputBlock);
        container.appendChild(item);
    }

    function removeFractionInput() {
        const container = document.getElementById('fractionsContainer');
        if (container.children.length > 2) {
            container.removeChild(container.lastChild);
            fractionCount--;
        } else {
            alert("至少需要保留兩個分數進行計算！");
        }
    }

    function getGCD(a, b) {
        return b === 0 ? a : getGCD(b, a % b);
    }

    function getLCM(a, b) {
        return (a * b) / getGCD(a, b);
    }

    function fractionHTML(num, den) {
        return `<span class="math-flex"><span>${num}</span><span class="math-line"></span><span>${den}</span></span>`;
    }

    function calculate() {
        const numInputs = document.querySelectorAll('.num-input');
        const denInputs = document.querySelectorAll('.den-input');

        const numerators = [];
        const denominators = [];

        for (let i = 0; i < numInputs.length; i++) {
            const n = parseInt(numInputs[i].value);
            const d = parseInt(denInputs[i].value);

            if (isNaN(n) || isNaN(d)) {
                alert(`請完整填寫第 ${i + 1} 個分數！`);
                return;
            }
            if (d === 0) {
                alert(`第 ${i + 1} 個分數的分母不能為 0！`);
                return;
            }

            numerators.push(n);
            denominators.push(d);
        }

        let commonDenom = denominators[0];
        for (let i = 1; i < denominators.length; i++) {
            commonDenom = getLCM(commonDenom, denominators[i]);
        }

        const newNumerators = numerators.map((n, i) => n * (commonDenom / denominators[i]));
        const sumNumerator = newNumerators.reduce((a, b) => a + b, 0);
        const expandedNumeratorStr = newNumerators.join(' + ');
        
        let outputHTML = "";
        outputHTML += newNumerators.map(n => fractionHTML(n, commonDenom)).join(' + ');
        outputHTML += ` = ${fractionHTML(expandedNumeratorStr, commonDenom)}`;
        outputHTML += ` = <span class="final-answer">${fractionHTML(sumNumerator, commonDenom)}</span>`;

        document.getElementById('equationOutput').innerHTML = outputHTML;
        document.getElementById('resultBox').style.display = 'block';
    }
</script>

</body>
</html>
