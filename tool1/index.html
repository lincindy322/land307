<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>土地登記費計算器 (多筆合算)</title>
  <style>
    :root {
      --ty-primary: #E6005A;   /* 桃紅 */
      --ty-secondary: #008080; /* 藍綠 */
      --ty-dark: #2A2A2A;      
      --ty-light: #F9F9FB;     
      --ty-white: #FFFFFF;
      --ty-gray: #E0E0E0;
      --ty-accent-bg: #FFF0F5;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--ty-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      color: var(--ty-dark);
    }

    .card {
      background: var(--ty-white);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 580px;
      border-top: 4px solid var(--ty-primary);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: var(--ty-primary);
      text-align: center;
      font-size: 1.4rem;
    }

    .land-item {
      background: var(--ty-light);
      border: 1px solid var(--ty-gray);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      position: relative;
    }

    .land-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: bold;
      color: var(--ty-dark);
    }

    .btn-delete {
      background: #d9534f;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-delete:hover {
      background: #c9302c;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 8px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
      color: #555;
      font-size: 0.85rem;
    }

    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--ty-gray);
      border-radius: 6px;
      font-size: 0.95rem;
    }

    input:focus {
      outline: none;
      border-color: var(--ty-primary);
    }

    .fraction-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .fraction-group span {
      font-size: 1rem;
      color: #777;
    }

    .subtotal-note {
      font-size: 0.8rem;
      color: #666;
      text-align: right;
      margin-top: 4px;
    }

    .btn-add {
      width: 100%;
      padding: 10px;
      background-color: var(--ty-accent-bg);
      color: var(--ty-primary);
      border: 2px dashed var(--ty-primary);
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }

    .btn-add:hover {
      opacity: 0.85;
    }

    .result-box {
      margin-top: 24px;
      padding: 18px;
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      text-align: center;
    }

    .result-title {
      font-size: 0.95rem;
      color: #16a34a;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .result-value-main {
      font-size: 2.2rem;
      font-weight: bold;
      color: #15803d;
      line-height: 1.2;
    }

    .result-value-raw {
      font-size: 0.85rem;
      color: #6b7280;
      margin-top: 6px;
    }

    .formula-note {
      font-size: 0.8rem;
      color: #888;
      margin-top: 16px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>土地登記費計算器 (多筆合算)</h2>

  <div id="land-list"></div>

  <button class="btn-add" onclick="addLand()">+ 新增一筆土地</button>

  <div class="result-box">
    <div class="result-title">案件總登記費 (整案加總後無條件捨去)</div>
    <div class="result-value-main" id="result-main">NT$ 0</div>
    <div class="result-value-raw" id="result-raw">未捨去總精確數值：NT$ 0</div>
  </div>

  <div class="formula-note">
    計算規則：Σ (各筆當期申報地價 × 面積 × 持分 × 0.001) → 總額無條件捨去
  </div>
</div>

<script>
  let landCount = 0;

  window.onload = function() {
    addLand();
  };

  function addLand() {
    landCount++;
    const id = landCount;

    const landList = document.getElementById('land-list');
    const div = document.createElement('div');
    div.className = 'land-item';
    div.id = `land-${id}`;

    div.innerHTML = `
      <div class="land-header">
        <span>土地 #${id}</span>
        ${id > 1 ? `<button class="btn-delete" onclick="removeLand(${id})">刪除</button>` : ''}
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>當期申報地價 (元/㎡)</label>
          <input type="number" class="price" placeholder="例如：50000" oninput="calculate()">
        </div>
        <div class="form-group">
          <label>面積 (平方公尺)</label>
          <input type="number" class="area" placeholder="例如：100" oninput="calculate()">
        </div>
      </div>
      <div class="form-group">
        <label>權利範圍 (分子 / 分母)</label>
        <div class="fraction-group">
          <input type="number" class="numerator" value="1" placeholder="分子" oninput="calculate()">
          <span>/</span>
          <input type="number" class="denominator" value="1" placeholder="分母" oninput="calculate()">
        </div>
      </div>
      <div class="subtotal-note" id="subtotal-${id}">本筆試算：NT$ 0</div>
    `;

    landList.appendChild(div);
    calculate();
  }

  function removeLand(id) {
    const item = document.getElementById(`land-${id}`);
    if (item) {
      item.remove();
      calculate();
    }
  }

  function calculate() {
    const items = document.querySelectorAll('.land-item');
    let grandTotalRaw = 0;
    let hasError = false;

    items.forEach((item) => {
      const id = item.id.replace('land-', '');
      const price = parseFloat(item.querySelector('.price').value) || 0;
      const area = parseFloat(item.querySelector('.area').value) || 0;
      const numerator = parseFloat(item.querySelector('.numerator').value) || 0;
      const denominator = parseFloat(item.querySelector('.denominator').value) || 1;

      const subtotalNote = document.getElementById(`subtotal-${id}`);

      if (denominator === 0) {
        subtotalNote.innerText = '錯誤：分母不可為 0';
        subtotalNote.style.color = '#d9534f';
        hasError = true;
        return;
      } else {
        subtotalNote.style.color = '#666';
      }

      const rawSubtotal = price * area * (numerator / denominator) * 0.001;
      grandTotalRaw += rawSubtotal;

      subtotalNote.innerText = `本筆試算：NT$ ${rawSubtotal.toLocaleString('zh-TW', { minimumFractionDigits: 0, maximumFractionDigits: 2 })}`;
    });

    if (hasError) {
      document.getElementById('result-main').innerText = '計算錯誤';
      document.getElementById('result-raw').innerText = '請檢查分母設定';
      return;
    }

    const grandTotalFloor = Math.floor(grandTotalRaw);

    document.getElementById('result-main').innerText = `NT$ ${grandTotalFloor.toLocaleString('zh-TW')}`;

    const formattedRaw = Number.isInteger(grandTotalRaw)
      ? grandTotalRaw.toLocaleString('zh-TW')
      : grandTotalRaw.toLocaleString('zh-TW', { minimumFractionDigits: 1, maximumFractionDigits: 4 });

    document.getElementById('result-raw').innerText = `未捨去總精確數值：NT$ ${formattedRaw}`;
  }
</script>

</body>
</html>
